name: CI & Auto-Release on Commit Pipeline

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify Existing Green Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse_green: ${{ steps.green.outputs.reuse_green }}
      verified_pr_head: ${{ steps.green.outputs.verified_pr_head }}
    steps:
      - name: Detect already-green merged PR head
        id: green
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('reuse_green', 'false');
            core.setOutput('verified_pr_head', '');

            // PRs must always execute the full matrix. Tags, manual runs, direct
            // pushes, squash merges, and rebases also fall back to full CI.
            if (context.eventName !== 'push') return;
            if (!['refs/heads/master', 'refs/heads/main'].includes(context.ref)) return;

            const { owner, repo } = context.repo;
            const commit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: context.sha,
            });
            const parents = commit.data.parents || [];
            if (parents.length !== 2) {
              core.notice('No two-parent merge commit; full CI will run.');
              return;
            }

            // For a normal GitHub merge commit, parent[1] is the exact PR head
            // that was tested before merge. Never infer green from the new merge SHA.
            const prHead = parents[1].sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: prHead,
            });
            const mergedPr = prs.data.find(pr =>
              pr.merged_at && ['master', 'main'].includes(pr.base.ref)
            );
            if (!mergedPr) {
              core.notice(`No merged PR found for ${prHead}; full CI will run.`);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: prHead,
              event: 'pull_request',
              status: 'completed',
              per_page: 50,
            });
            const greenRun = runs.data.workflow_runs.find(run =>
              run.name === context.workflow && run.conclusion === 'success'
            );
            if (!greenRun) {
              core.notice(`No successful PR CI run found for ${prHead}; full CI will run.`);
              return;
            }

            core.notice(
              `Reusing successful PR CI run ${greenRun.id} for PR #${mergedPr.number} ` +
              `at ${prHead}. Master will package/release without rerunning the matrix.`
            );
            core.setOutput('reuse_green', 'true');
            core.setOutput('verified_pr_head', prHead);

  test:
    name: Run Test Suite (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.reuse_green != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libtk8.6

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Execute Full Test Suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m pytest -v
          else
            python -m pytest -v
          fi

  build-and-release:
    name: Build & Auto-Publish Release Packages
    needs: [preflight, test]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.preflight.result == 'success' &&
      (needs.preflight.outputs.reuse_green == 'true' || needs.test.result == 'success')
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Report Release Gate
        shell: bash
        run: |
          if [ "${{ needs.preflight.outputs.reuse_green }}" = "true" ]; then
            echo "Reusing already-green PR head: ${{ needs.preflight.outputs.verified_pr_head }}"
            echo "Skipping duplicate six-lane test matrix on merged master commit."
          else
            echo "Using successful tests from this workflow run."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Application Packages (macOS, Windows, Linux)
        run: |
          python build_app.py

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: SmartAI-Packages
          path: |
            dist/SmartAI-macOS-arm64.zip
            dist/SmartAI-Windows.zip
            dist/SmartAI-Linux-x86_64.tar.gz
            dist/SmartAI-Unix-POSIX.tar.gz

      - name: Determine Release Tag & Title
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TITLE="Smart AI Studio ${TAG_NAME}"
          else
            TAG_NAME="latest"
            TITLE="Smart AI Studio — Rolling Release (${GITHUB_SHA::7})"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          files: |
            dist/SmartAI-macOS-arm64.zip
            dist/SmartAI-Windows.zip
            dist/SmartAI-Linux-x86_64.tar.gz
            dist/SmartAI-Unix-POSIX.tar.gz
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
