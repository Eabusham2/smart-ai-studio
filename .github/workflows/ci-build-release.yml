name: CI & Auto-Release on Commit Pipeline

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish packages after green CI (default branch or version tag only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify Existing Green Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse_green: ${{ steps.green.outputs.reuse_green }}
      verified_pr_head: ${{ steps.green.outputs.verified_pr_head }}
      verified_run_id: ${{ steps.green.outputs.verified_run_id }}
      native_reuse_run_id: ${{ steps.native.outputs.native_reuse_run_id }}
      native_reuse_matrix: ${{ steps.native.outputs.native_reuse_matrix }}
    steps:
      - name: Detect already-green merged PR head
        id: green
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('reuse_green', 'false');
            core.setOutput('verified_pr_head', '');
            core.setOutput('verified_run_id', '');

            // PRs always execute the full Python matrix. Tags, manual runs, direct
            // pushes, squash merges, and rebases also fall back to full CI.
            if (context.eventName !== 'push') return;
            if (!['refs/heads/master', 'refs/heads/main'].includes(context.ref)) return;

            const { owner, repo } = context.repo;
            const commit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: context.sha,
            });
            const parents = commit.data.parents || [];
            if (parents.length !== 2) {
              core.notice('No two-parent merge commit; full CI will run.');
              return;
            }

            // For a normal GitHub merge commit, parent[1] is the exact PR head
            // that was tested before merge. Never infer green from the new merge SHA.
            const prHead = parents[1].sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: prHead,
            });
            const mergedPr = prs.data.find(pr =>
              pr.merged_at && ['master', 'main'].includes(pr.base.ref)
            );
            if (!mergedPr) {
              core.notice(`No merged PR found for ${prHead}; full CI will run.`);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: prHead,
              event: 'pull_request',
              status: 'completed',
              per_page: 50,
            });
            const greenRun = runs.data.workflow_runs.find(run =>
              run.name === context.workflow && run.conclusion === 'success'
            );
            if (!greenRun) {
              core.notice(`No successful PR CI run found for ${prHead}; full CI will run.`);
              return;
            }

            // Reuse only when both compiled, model-free runtimes are still
            // available for packaging from this exact successful PR run.
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: greenRun.id, per_page: 100,
            });
            const nativeArtifacts = artifacts.artifacts.filter(artifact =>
              artifact.name.startsWith('SmartAI-native-') && !artifact.expired
            );
            if (nativeArtifacts.length !== 2 ||
                !nativeArtifacts.some(artifact => artifact.name.startsWith('SmartAI-native-cpu-Linux-')) ||
                !nativeArtifacts.some(artifact => artifact.name.startsWith('SmartAI-native-metal-macOS-'))) {
              core.notice('Tested native build artifacts are unavailable; full CI will run.');
              return;
            }

            core.notice(
              `Reusing successful PR CI run ${greenRun.id} for PR #${mergedPr.number} ` +
              `at ${prHead}. Master will package/release without rerunning the matrix.`
            );
            core.setOutput('reuse_green', 'true');
            core.setOutput('verified_pr_head', prHead);
            core.setOutput('verified_run_id', greenRun.id);

      - name: Detect reusable native compile artifacts
        id: native
        if: steps.green.outputs.reuse_green != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('native_reuse_run_id', '');
            core.setOutput('native_reuse_matrix', '{"include":[]}');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (pr && pr.head.repo?.full_name !== `${owner}/${repo}`) return;
            const sourceBranch = pr ? pr.head.ref : context.ref.replace('refs/heads/', '');
            const workflowPath = '.github/workflows/ci-build-release.yml';
            const inputs = ['core/native_exactness.py', 'tools/prepare_speculative_runtime.py'];
            // Only the job's scheduling condition may differ. Runner, matrix,
            // actions, compiler commands, source URL, and all job env stay exact.
            function nativeDefinition(source) {
              if (/^(env|defaults):/m.test(source)) return null;
              source = source.replace(/\r\n/g, '\n');
              const boundary = source.indexOf('\njobs:\n');
              if (boundary < 0) return null;
              const header = source.slice(0, boundary);
              const lines = source.split('\n');
              const start = lines.indexOf('  native-build:');
              if (start < 0) return null;
              let end = start + 1;
              while (end < lines.length && !/^  [A-Za-z][A-Za-z0-9_-]*:/.test(lines[end])) end++;
              return header + '\n' + lines.slice(start, end).filter(line => !/^    if:/.test(line)).join('\n').trimEnd();
            }
            async function fileAt(path, ref) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (data.type !== 'file' || data.encoding !== 'base64' || !/^[a-f0-9]{40}$/.test(data.sha)) {
                throw new Error(`Cannot verify source blob ${path}`);
              }
              return { sha: data.sha, text: Buffer.from(data.content, 'base64').toString('utf8') };
            }
            try {
              const current = await Promise.all(inputs.map(path => fileAt(path, context.sha)));
              const definition = nativeDefinition((await fileAt(workflowPath, context.sha)).text);
              if (!definition) return;
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, branch: sourceBranch, event: pr ? 'pull_request' : 'push', status: 'completed', per_page: 30,
              });
              for (const run of data.workflow_runs) {
                if (run.id === context.runId || run.name !== context.workflow || run.path !== workflowPath ||
                    run.head_repository?.full_name !== `${owner}/${repo}` ||
                    run.head_branch !== sourceBranch ||
                    (pr && !run.pull_requests.some(item => item.number === pr.number && item.base.sha === pr.base.sha))) continue;
                try {
                  // A head containing the recorded base has the same build tree
                  // as its PR merge checkout. Diverged/rebased bases rebuild.
                  const { data: comparison } = await github.rest.repos.compareCommits({
                    owner, repo, base: pr ? pr.base.sha : run.head_sha, head: pr ? run.head_sha : context.sha,
                  });
                  if (!['ahead', 'identical'].includes(comparison.status)) continue;
                  const previous = await Promise.all(inputs.map(path => fileAt(path, run.head_sha)));
                  if (previous.some((file, index) => file.sha !== current[index].sha)) continue;
                  if (nativeDefinition((await fileAt(workflowPath, run.head_sha)).text) !== definition) continue;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                  });
                  if (!['cpu', 'metal'].every(backend => jobs.some(job =>
                      job.name === `Compile Native Verifier (${backend}, no models)` && job.conclusion === 'success'))) continue;
                  const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                    owner, repo, run_id: run.id, per_page: 100,
                  });
                  const native = artifacts.filter(item => item.name.startsWith('SmartAI-native-'));
                  const expected = [
                    { backend: 'cpu', pattern: /^SmartAI-native-cpu-Linux-(X64|ARM64)$/ },
                    { backend: 'metal', pattern: /^SmartAI-native-metal-macOS-(X64|ARM64)$/ },
                  ];
                  if (native.length !== 2 || native.some(item => item.expired ||
                      !Number.isFinite(Date.parse(item.expires_at)) || Date.parse(item.expires_at) <= Date.now() || !(item.size_in_bytes > 0))) continue;
                  const matrix = expected.map(item => {
                    const matches = native.filter(artifact => item.pattern.test(artifact.name));
                    return matches.length === 1 ? { backend: item.backend, name: matches[0].name } : null;
                  });
                  if (matrix.some(item => !item)) continue;
                  core.setOutput('native_reuse_run_id', String(run.id));
                  core.setOutput('native_reuse_matrix', JSON.stringify({ include: matrix }));
                  core.notice(`Reusing both unchanged native compilations from run ${run.id}; all Python lanes still run.`);
                  return;
                } catch (error) {
                  core.notice(`Native artifacts from run ${run.id} are not verifiable: ${error.message}`);
                }
              }
            } catch (error) {
              core.notice(`Native reuse unavailable; compiling both runtimes: ${error.message}`);
            }

  test:
    name: Run Test Suite (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.reuse_green != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Windows toolcache occasionally contains incomplete Tcl/Tk 8.6 scripts:
      # Python 3.10 lacks ttk/xpTheme.tcl, while Python 3.11 may lack a
      # readable tcl8.6/init.tcl. Prepare both versions and use the complete
      # library halves with the requested Python rather than skipping GUI tests.
      - name: Prepare Windows Python 3.10 Tcl source
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare Windows Python 3.11 Tk source
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Repair Windows Tcl/Tk and verify real GUI initialization
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonHome = (python -c "import sys; print(sys.prefix)").Trim()
          $versions = Get-ChildItem (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Directory
          $tclSource = $null
          $tkSource = $null
          foreach ($version in ($versions | Sort-Object Name -Descending)) {
            $tclCandidate = Join-Path $version.FullName 'x64\tcl\tcl8.6'
            $tkCandidate = Join-Path $version.FullName 'x64\tcl\tk8.6'
            if ($version.Name -like '3.10.*' -and (Test-Path (Join-Path $tclCandidate 'init.tcl'))) {
              $tclSource = $tclCandidate
            }
            if ($version.Name -like '3.11.*' -and (Test-Path (Join-Path $tkCandidate 'ttk\xpTheme.tcl'))) {
              $tkSource = $tkCandidate
            }
          }
          if (-not $tclSource -or -not $tkSource) {
            throw 'Complete Tcl/Tk 8.6 sources unavailable in Windows Python toolcache.'
          }
          $tclTarget = Join-Path $pythonHome 'tcl\tcl8.6'
          $tkTarget = Join-Path $pythonHome 'tcl\tk8.6'
          New-Item -ItemType Directory -Force -Path $tclTarget,$tkTarget | Out-Null
          # One side is the selected interpreter's own complete library.
          # Copying it onto itself errors on Windows PowerShell; preserve it.
          if ([IO.Path]::GetFullPath($tclSource).TrimEnd('\\') -ine [IO.Path]::GetFullPath($tclTarget).TrimEnd('\\')) {
            Copy-Item -Path (Join-Path $tclSource '*') -Destination $tclTarget -Recurse -Force
          }
          if ([IO.Path]::GetFullPath($tkSource).TrimEnd('\\') -ine [IO.Path]::GetFullPath($tkTarget).TrimEnd('\\')) {
            Copy-Item -Path (Join-Path $tkSource '*') -Destination $tkTarget -Recurse -Force
          }
          $env:TCL_LIBRARY = $tclTarget
          $env:TK_LIBRARY = $tkTarget
          "TCL_LIBRARY=$tclTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TK_LIBRARY=$tkTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.destroy(); print('Real Tk 8.6 GUI initialized with matrix Python')"

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libtk8.6

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" != "macOS" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Execute Full Test Suite
        shell: bash
        env:
          SMARTAI_TEST_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          RUN_REAL_WEIGHTS_EVAL: "0"
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m pytest -v --junitxml=desktop-tests.xml
          else
            python -m pytest -v --junitxml=desktop-tests.xml
          fi

      - name: Require real desktop regression coverage
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('desktop-tests.xml').iter('testcase'))
          required = {
              'test_all_persistent_controls_visible_clickable_and_inside_window': 8,
              'test_repeated_theme_switch_covers_hidden_panels_dialogs_tags_and_hover': 1,
              'test_live_thought_opens_can_collapse_during_decode_then_closes_once_and_reopens': 1,
              'test_manual_scroll_preempts_pending_tail_callbacks_and_new_chunks_do_not_jump': 1,
              'test_completion_reformat_preserves_the_readers_visible_content': 6,
              'test_hybrid_and_pro_branches_are_on_by_default_with_two_passes': 1,
              'test_gui_runs_sequential_best_work_and_displays_only_final_selected_pass': 2,
              'test_branch_dialog_keeps_explicit_single_pass_for_the_next_best_work_request': 1,
              'test_model_switch_routes_sql_tools_learner_and_transcript_to_same_owner': 1,
              'test_stop_then_send_waits_for_the_old_worker_to_release_its_request': 1,
              'test_implementation_control_preserves_both_transcripts_and_original_default_actions': 2,
              'test_context_updates_on_prefill_and_decode_then_labels_completed_invocation': 1,
              'test_canvas_preserves_editor_line_number_and_shows_exception': 1,
              'test_canvas_long_stdout_keeps_final_traceback_visible_in_bounded_real_widget': 1,
          }
          for name, minimum in required.items():
              matched = [case for case in cases if case.get('name', '').split('[', 1)[0] == name]
              assert len(matched) >= minimum, f'Missing desktop regression coverage: {name}'
              assert all(case.find('skipped') is None for case in matched), f'Desktop regression was skipped: {name}'
          print('Verified actual desktop visibility, theme, reasoning, scrolling, model ownership, context and Canvas coverage')
          PY

  mlx-learning:
    name: Native MLX Learning (${{ matrix.device }})
    needs: preflight
    if: needs.preflight.outputs.reuse_green != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            device: cpu
          - os: macos-latest
            device: metal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real MLX and learning dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.device }}" = "cpu" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install 'mlx[cpu]==0.32.4' 'mlx-lm==0.32.2'
          else
            python -m pip install 'mlx==0.32.4' 'mlx-lm==0.32.2'
          fi
          python -m pip install -r requirements.txt
      - name: Verify actual compute device
        env:
          MLX_TEST_DEVICE: ${{ matrix.device }}
        run: |
          python - <<'PY'
          import os
          import mlx.core as mx
          from mlx_lm.models import qwen3_5
          wanted = os.environ['MLX_TEST_DEVICE']
          if wanted == 'metal':
              assert mx.metal.is_available(), 'Metal is required; CPU fallback cannot pass this lane'
              mx.set_default_device(mx.gpu)
          else:
              mx.set_default_device(mx.cpu)
          result = mx.sum(mx.square(mx.arange(8, dtype=mx.float32)))
          mx.eval(result)
          assert result.item() == 140
          print('Verified MLX device:', mx.default_device())
          PY
      - name: Exercise packed Bonsai layouts and native learning
        shell: bash
        env:
          SMARTAI_TEST_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          RUN_REAL_WEIGHTS_EVAL: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MLX_TEST_DEVICE: ${{ matrix.device }}
        run: |
          python -m pytest -v --junitxml=mlx-learning.xml tests/unit/test_mlx_packed_terminal.py tests/unit/test_mlx_learning_implementations.py tests/unit/test_query_reward_adaptation.py tests/unit/test_native_context_learning.py tests/unit/test_mlx_context_memory.py tests/unit/test_mlx_adapter_persistence.py tests/unit/test_mlx_thread_owner.py tests/unit/test_mlx_runtime_lock.py tests/unit/test_mlx_speed_tuning.py tests/unit/test_mlx_publisher_runtime_compat.py tests/unit/test_memory_routing.py tests/unit/test_online_task_extensions.py tests/unit/test_verifier_large_program.py tests/unit/test_consolidation_memory_lifecycle.py tests/unit/test_mlx_memory_guard.py tests/unit/test_exact_context_usage.py tests/unit/test_vlm_input_memo.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = [c for c in ET.parse('mlx-learning.xml').iter('testcase')
                   if 'test_mlx_packed_terminal' in c.get('classname', '')]
          assert len(cases) >= 2, 'Both packed Bonsai layouts must be exercised'
          assert all(c.find('skipped') is None for c in cases), 'Packed native MLX tests cannot be skipped'
          parity = [c for c in ET.parse('mlx-learning.xml').iter('testcase')
                    if 'test_mlx_learning_implementations' in c.get('classname', '')]
          assert len(parity) >= 13, 'Original and hybrid MLX algorithms and namespace isolation must be exercised'
          assert all(c.find('skipped') is None for c in parity), 'Original MLX parity tests cannot be skipped'
          protected = [c for c in ET.parse('mlx-learning.xml').iter('testcase')
                       if 'test_mlx_adapter_persistence' in c.get('classname', '')
                       and c.get('name', '').startswith((
                           'test_training_export_protects_foreign_generations_and_rolls_back',
                           'test_own_current_generation_reference_publishes_only_a_successor'))]
          assert len(protected) >= 9, 'Every implementation must protect its immutable checkpoints'
          assert all(c.find('skipped') is None for c in protected), 'Immutable checkpoint protection tests cannot be skipped'
          lifecycle = [c for c in ET.parse('mlx-learning.xml').iter('testcase')
                       if 'test_consolidation_memory_lifecycle' in c.get('classname', '')]
          assert len(lifecycle) >= 4, 'Repeated consolidation lifecycle tests must execute'
          assert all(c.find('skipped') is None for c in lifecycle), 'Native consolidation lifecycle tests cannot be skipped'
          retry_cleanup = [c for c in ET.parse('mlx-learning.xml').iter('testcase')
                           if c.get('name') == 'test_real_mlx_failed_prefill_tensor_is_freed_before_retry']
          assert len(retry_cleanup) == 1, 'Native inference retry cleanup must execute'
          assert retry_cleanup[0].find('skipped') is None, 'Native inference retry cleanup cannot be skipped'
          entropy = [c for c in ET.parse('mlx-learning.xml').iter('testcase')
                     if c.get('name', '').split('[', 1)[0] == 'test_real_mlx_last_projection_entropy_matches_original_forward']
          assert len(entropy) == 2, 'Both native entropy projection contracts must execute'
          assert all(c.find('skipped') is None for c in entropy), 'Native entropy projection parity cannot be skipped'
          input_memo = [c for c in ET.parse('mlx-learning.xml').iter('testcase')
                        if 'test_vlm_input_memo' in c.get('classname', '')]
          assert len(input_memo) >= 14, 'Native VLM input memo exactness, lifecycle and deferred tuning tests must execute'
          assert all(c.find('skipped') is None for c in input_memo), 'Native VLM input memo tests cannot be skipped'
          PY
      - name: Preserve native learning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartAI-mlx-learning-${{ matrix.device }}
          path: mlx-learning.xml
          if-no-files-found: error

  native-build:
    name: Compile Native Verifier (${{ matrix.backend }}, no models)
    needs: preflight
    if: needs.preflight.outputs.reuse_green != 'true' && needs.preflight.outputs.native_reuse_run_id == ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: cpu
          - os: macos-latest
            backend: metal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned source archive only
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://huggingface.co/ProCreations/Ternary-Bonsai-2-27B-DFlash2/resolve/4cfb6ad03268fed0f60ca96c1a659c0b1c77e50b/runtime/prism-dflash2-source.tar.gz' \
            --output prism-source.tar.gz
      - name: Compile patched verifier without executing a model
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          RUN_REAL_WEIGHTS_EVAL: "0"
        run: |
          python tools/prepare_speculative_runtime.py \
            --source-archive prism-source.tar.gz --output-dir native-exact \
            --backend '${{ matrix.backend }}' --jobs 2
          mkdir native-release
          cp native-exact/build-smartai/bin/llama-server native-release/
          cp native-exact/build-smartai/bin/llama-server.smartai.json native-release/
          cp native-exact/LICENSE native-release/Prism-llama-LICENSE
          cp docs/ternary-speedups.md native-release/README.md
      - name: Preserve the exact compiled runtime and receipt
        uses: actions/upload-artifact@v4
        with:
          name: SmartAI-native-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}
          path: native-release/
          if-no-files-found: error
          retention-days: 30

  reuse-native:
    name: Reuse Native Verifier (${{ matrix.backend }}, verified artifact)
    needs: preflight
    if: needs.preflight.outputs.reuse_green != 'true' && needs.preflight.outputs.native_reuse_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.native_reuse_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch the previously successful native artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: native-release
          run-id: ${{ needs.preflight.outputs.native_reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reused binary and receipt against current source
        shell: bash
        env:
          NATIVE_BACKEND: ${{ matrix.backend }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json, os, shutil
          root = Path('native-release')
          required = {'llama-server', 'llama-server.smartai.json', 'Prism-llama-LICENSE', 'README.md'}
          if {item.name for item in root.iterdir()} != required:
              raise RuntimeError('Unexpected native artifact layout')
          if any((root / name).is_symlink() or not (root / name).is_file() for name in required):
              raise RuntimeError('Native artifact contains a link or non-file')
          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()
          patcher = Path('core/native_exactness.py')
          constants = {node.targets[0].id: ast.literal_eval(node.value)
                       for node in ast.parse(patcher.read_text(encoding='utf-8')).body
                       if isinstance(node, ast.Assign) and len(node.targets) == 1
                       and isinstance(node.targets[0], ast.Name)
                       and node.targets[0].id in {'CONTRACT', 'SOURCE_ARCHIVE_SHA256'}}
          receipt = json.loads((root / 'llama-server.smartai.json').read_text(encoding='utf-8'))
          backend = os.environ['NATIVE_BACKEND']
          if (backend not in {'cpu', 'metal'} or receipt.get('schema_version') != 1
                  or receipt.get('backend') != backend
                  or receipt.get('binary_sha256') != digest(root / 'llama-server')
                  or receipt.get('patcher_sha256') != digest(patcher)
                  or receipt.get('source_archive_sha256') != constants['SOURCE_ARCHIVE_SHA256']
                  or receipt.get('exactness_contract') != constants['CONTRACT']):
              raise RuntimeError('Reused native receipt does not match the binary and current source')
          if not (root / 'llama-server').stat().st_size or not (root / 'Prism-llama-LICENSE').stat().st_size:
              raise RuntimeError('Native binary or license is empty')
          (root / 'llama-server').chmod(0o755)
          shutil.copyfile('docs/ternary-speedups.md', root / 'README.md')
          print('Verified existing binary and receipt; refreshed README without recompiling or running a model.')
          PY
      - name: Preserve verified native artifact in this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: native-release/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Portable and Setup (${{ matrix.target }}, no models)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: Linux-x86_64
          - os: windows-latest
            target: Windows-x86_64
          - os: macos-latest
            target: macOS-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxext6 libxrender1 libxft2 libgl1
      - name: Build bundled runtime and test relocated first launch
        shell: bash
        env:
          SMARTAI_MODEL_BUNDLE_RELEASE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          RUN_REAL_WEIGHTS_EVAL: "0"
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python tools/build_release_package.py --target "${{ matrix.target }}" --output release-packages
          else
            python tools/build_release_package.py --target "${{ matrix.target }}" --output release-packages
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SmartAI-ready-${{ matrix.target }}
          path: release-packages/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  build-and-release:
    name: Build & Auto-Publish Release Packages
    needs: [preflight, test, mlx-learning, native-build, reuse-native, package]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) &&
      needs.preflight.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.preflight.outputs.reuse_green == 'true' ||
       (needs.test.result == 'success' && needs.mlx-learning.result == 'success' &&
        (needs.native-build.result == 'success' || needs.reuse-native.result == 'success')))
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Report Release Gate
        shell: bash
        run: |
          if [ "${{ needs.preflight.outputs.reuse_green }}" = "true" ]; then
            echo "Reusing already-green PR head: ${{ needs.preflight.outputs.verified_pr_head }}"
            echo "Skipping duplicate six-lane test matrix on merged master commit."
          else
            echo "Using successful tests from this workflow run."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch the exact green native builds
        uses: actions/download-artifact@v4
        with:
          pattern: SmartAI-native-*
          path: native-runtime-downloads
          run-id: ${{ needs.preflight.outputs.verified_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub

      - name: Determine Release Tag & Title
        id: release_info
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TITLE="Smart AI Studio ${TAG_NAME}"
          else
            TAG_NAME="latest"
            TITLE="Smart AI Studio — Rolling Release (${GITHUB_SHA::7})"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Release for Streamed Model Bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release_info.outputs.release_title }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --draft --notes "Packaging release assets..."
          fi

          # Keep prior downloads until replacement files pass the final gate.
          # The model bundler uploads matching part names with --clobber.

      - name: Download native-OS portable and setup packages
        uses: actions/download-artifact@v4
        with:
          pattern: SmartAI-ready-*
          path: dist
          merge-multiple: true

      - name: Verify package receipts and recover the tested Mac app
        shell: bash
        run: |
          python tools/verify_release_packages.py dist --commit "$GITHUB_SHA"
          mkdir -p verified-mac-app
          tar -xzf dist/SmartAI.app.tar.gz -C verified-mac-app
          mv verified-mac-app/SmartAI.app dist/SmartAI.app
          rm dist/SmartAI.app.tar.gz

      - name: Package native runtimes and verified receipts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          Path('dist').mkdir(exist_ok=True)
          runtimes = list(Path('native-runtime-downloads').glob('SmartAI-native-*'))
          if len(runtimes) != 2:
              raise RuntimeError('Expected both exact CI-built native runtimes')
          patcher_hash = hashlib.sha256(Path('core/native_exactness.py').read_bytes()).hexdigest()
          for runtime in runtimes:
              binary = runtime / 'llama-server'
              receipt = json.loads((runtime / 'llama-server.smartai.json').read_text())
              if (receipt['binary_sha256'] != hashlib.sha256(binary.read_bytes()).hexdigest()
                      or receipt['patcher_sha256'] != patcher_hash
                      or receipt['exactness_contract'] != 'smartai-serial-target-v1'):
                  raise RuntimeError('Native release receipt does not match the tested code')
              binary.chmod(0o755)
              shutil.make_archive(str(Path('dist') / runtime.name), 'zip', runtime)
          PY

      - name: Stream Both Bonsai 2 MLX Models into macOS Release ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
        run: |
          python build_bonsai2_bundled_zip.py \
            --app-bundle dist/SmartAI.app \
            --output-dir dist \
            --archive-name SmartAI-macOS-arm64.zip \
            --upload-tag "$RELEASE_TAG"

      - name: Build no-admin Apple Silicon portable kit with both preloaded models
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
        run: |
          # The app + both model repositories are already in the split archive
          # verified above. Reuse those exact SHA256 parts; uploading them twice
          # would waste ~18 GB and risks two mismatched release variants.
          python tools/build_macos_noadmin_portable.py \
            --manifest dist/SmartAI-macOS-arm64.bundle.json \
            --assembler dist/Reassemble-SmartAI-macOS-arm64.command \
            --output-dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA"
          cd dist
          /usr/bin/shasum -a 256 -c SmartAI-macOS-arm64-NoAdmin-Portable-Kit.zip.sha256

      - name: Build standalone full Mac installer with verified two-model kit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
        run: |
          python -m tools.build_macos_full_installer \
            --kit dist/SmartAI-macOS-arm64-NoAdmin-Portable-Kit.zip \
            --output-dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA"
          /bin/bash -n dist/Install-SmartAI-macOS-Full.command
          cd dist
          /usr/bin/shasum -a 256 -c Install-SmartAI-macOS-Full.command.sha256

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: SmartAI-Packages
          path: |
            dist/*.json
            dist/*.command
            dist/*.ps1
            dist/*.sh
            dist/*.sha256
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release_info.outputs.release_title }}
        run: |
          python tools/verify_release_packages.py dist --commit "$GITHUB_SHA"
          python - <<'PYUPLOAD'
          from pathlib import Path
          import os, subprocess
          for path in sorted(Path('dist').iterdir()):
              if path.is_file():
                  subprocess.run(['gh','release','upload',os.environ['RELEASE_TAG'],str(path),'--clobber'],check=True)
          PYUPLOAD
          # Keep the extra no-admin download option discoverable in the
          # published release, without suggesting it contains a second 18GB copy.
          cat > smartai-release-notes.md <<'SMARTAI_RELEASE_NOTES'
          ## Smart AI Studio — full release

          ### Desktop fixes

          - Restore Eval, Context Limit, Auto speed and Speedups in the packaged
            app; initialization failures now produce a visible diagnostic.
          - Apply light/dark themes to existing dialogs, hidden panels and chat
            content, and keep action rows accessible when windows are resized.
          - Keep compatible execution speedups enabled when calibration lacks
            memory headroom; verified native Auto selects an available strategy.
          - Apply tokenizer memoization to eligible native VLM text requests,
            retaining only one bounded CPU snapshot and verifying exact input
            restoration in both native CPU and Metal test lanes.
          - Isolate episodic memory and chat updates by model, retain earlier
            shared history for read-only viewing, and require confirmed unloading
            before starting a replacement model or benchmark.
          - Keep thinking sections expandable after completion and preserve the
            reader's position when scrolling during generation.
          - Correct AI RAM accounting and explicitly release standalone Sleep
            training state; add repeated native consolidation lifecycle tests.
          - Count live context from the actual submitted input and generated
            tokens, including templates and system/tool text; keep speculative
            candidate costs separate and show unknown when no exact count exists.
          - Check MLX memory before each turn, bound prefill and optional cache
            copies, and release failed request state before one pre-output retry
            without changing the selected model or discarding conversation text.
          - Preserve Python Canvas editor line numbers and show the traceback
            even when the script printed long output before failing.
          - Queue messages sent after Stop until the previous worker finishes
            cleanup, and prevent the background monitor from raising a stricter
            MLX request cache limit. Unchanged monitor ticks keep the cache intact.
          - Require real desktop regression cases to execute in every platform
            test lane, including both themes at the minimum 760x600 window size.
          - Avoid unused full-sequence vocabulary logits in the entropy prepass
            on compatible MLX models, preserving the full prompt and routing
            calculation, and reclaim failed prepass state before generation.

          **Mac (Apple Silicon): automatic full installation to Applications**
          Download `Install-SmartAI-macOS-Full.command` and its `.sha256` receipt.
          In the download folder, run `shasum -a 256 -c Install-SmartAI-macOS-Full.command.sha256`,
          then `/bin/bash Install-SmartAI-macOS-Full.command`.
          It downloads the exact checksum-pinned kit, verifies and assembles all
          Mac archive parts, installs `SmartAI.app` with the complete embedded
          runtime and BOTH Bonsai 2 models into `/Applications`, removes its own
          redundant downloads and assembled ZIP, and opens the app. A previous
          app is backed up, and chat/learning data is preserved. An administrator
          password is requested only if writing to Applications requires it.
          Quit SmartAI before upgrading. Allow at least 55 GB free for a fresh
          installation. Completed downloads are retained after a failed attempt.

          **Mac (Apple Silicon): no-admin portable option**
          Download `SmartAI-macOS-arm64-NoAdmin-Portable-Kit.zip` and its
          `.sha256` receipt. Unzip it and open the included
          `Install-and-Launch-SmartAI-NoAdmin.command` (or run it with `/bin/bash`).
          It downloads the release's already-verified multipart Mac ZIP, which
          contains the complete app, embedded Python/dependencies and BOTH Bonsai 2
          model snapshots. Extraction goes to `~/Applications/SmartAI-Portable/`.
          No administrator credentials, Homebrew, Xcode, or system Python required.
          Both model snapshots are available offline after installation;
          inference still requires compatible Apple Silicon, MLX and memory.
          Allow at least 55 GB free space for assembly and extraction.

          The normal macOS, Windows, Linux, native runtime and Setup downloads
          remain available. Macs with insufficient unified memory may not run
          both 27B models simultaneously. Gatekeeper may require a normal
          user-level approval of this unsigned app; it is not disabled by the kit.
          SMARTAI_RELEASE_NOTES
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file smartai-release-notes.md --draft=false --latest

      - name: Verify Release Assets and Update Rolling Tag
        if: success()
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
        with:
          script: |
            const fs = require('fs').promises;
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            const manifest = JSON.parse(await fs.readFile('dist/SmartAI-macOS-arm64.bundle.json', 'utf8'));
            if (manifest.archive_name !== 'SmartAI-macOS-arm64.zip' || !Array.isArray(manifest.parts) || !manifest.parts.length) {
              throw new Error('The split macOS bundle has no valid release manifest.');
            }
            const expected = manifest.parts.map(part => {
              if (!/^SmartAI-macOS-arm64\.zip\.part[0-9]+$/.test(part.name) || !Number.isSafeInteger(part.size) || part.size <= 0) {
                throw new Error('The split macOS manifest contains an invalid part.');
              }
              return { name: part.name, size: part.size };
            });
            for (const name of ['SmartAI-macOS-arm64.bundle.json', 'Reassemble-SmartAI-macOS-arm64.command']) {
              expected.push({ name, size: (await fs.stat(`dist/${name}`)).size });
            }
            // The additional NoAdmin kit must be exactly this workflow's
            // inspected model manifest and checksum-verified release asset.
            const kitName = 'SmartAI-macOS-arm64-NoAdmin-Portable-Kit.zip';
            const receiptName = kitName + '.sha256';
            const kitBytes = await fs.readFile(`dist/${kitName}`);
            const kitDigest = require('crypto').createHash('sha256').update(kitBytes).digest('hex');
            const kitReceipt = (await fs.readFile(`dist/${receiptName}`, 'utf8')).trim();
            if (kitReceipt !== `${kitDigest}  ${kitName}`) {
              throw new Error('No-admin portable release kit has an invalid SHA256 receipt');
            }
            for (const name of [kitName, receiptName]) {
              expected.push({ name, size: (await fs.stat(`dist/${name}`)).size });
            }
            const installerName = 'Install-SmartAI-macOS-Full.command';
            const installerBytes = await fs.readFile(`dist/${installerName}`);
            const installerDigest = require('crypto').createHash('sha256').update(installerBytes).digest('hex');
            const installerReceiptName = installerName + '.sha256';
            const installerReceipt = (await fs.readFile(`dist/${installerReceiptName}`, 'utf8')).trim();
            const installerText = installerBytes.toString('utf8');
            if (installerReceipt !== `${installerDigest}  ${installerName}` ||
                !installerText.includes(`COMMIT="${context.sha}"`) ||
                !installerText.includes(`KIT_SHA256="${kitDigest}"`)) {
              throw new Error('Full Mac installer does not pin this commit and verified two-model kit');
            }
            for (const name of [installerName, installerReceiptName]) {
              expected.push({ name, size: (await fs.stat(`dist/${name}`)).size });
            }
            for (const target of ['Linux-x86_64', 'Windows-x86_64', 'macOS-arm64']) {
              const name = `SmartAI-${target}.receipt.json`;
              const receipt = JSON.parse(await fs.readFile(`dist/${name}`, 'utf8'));
              if (receipt.commit !== context.sha || receipt.gui_smoke !== 'passed' || receipt.setup_smoke !== 'passed' || (target.startsWith('macOS') && receipt.dmg_smoke !== 'passed')) throw new Error(`Unverified package ${target}`);
              expected.push({ name, size: (await fs.stat(`dist/${name}`)).size });
              expected.push(...receipt.files.map(item => ({ name: item.name, size: item.size })));
            }
            const nativeArchives = (await fs.readdir('dist')).filter(name => /^SmartAI-native-.*\.zip$/.test(name));
            if (nativeArchives.length !== 2) throw new Error('Missing tested native runtime packages');
            for (const name of nativeArchives) {
              expected.push({ name, size: (await fs.stat(`dist/${name}`)).size });
            }
            if (new Set(expected.map(item => item.name)).size !== expected.length) {
              throw new Error('The release manifest contains duplicate part names.');
            }
            for (const item of expected) {
              const asset = assets.find(asset => asset.name === item.name);
              if (!asset || asset.state !== 'uploaded' || item.size <= 0 || asset.size !== item.size) {
                throw new Error(`Release asset is missing, incomplete, or the wrong size: ${item.name}`);
              }
            }

            // Do not leave the old dependency-less packages alongside the
            // verified replacement: users could otherwise download an unfixed
            // Windows/Unix archive from this new release by mistake.
            const currentNames = new Set(expected.map(item => item.name));
            const legacyNames = new Set([
              'SmartAI-macOS-arm64.zip', 'SmartAI-Windows.zip',
              'SmartAI-Unix-POSIX.tar.gz', 'SmartAI-Linux-x86_64.tar.gz',
            ]);
            for (const asset of assets.filter(asset => !currentNames.has(asset.name) &&
                (legacyNames.has(asset.name) || /^SmartAI-macOS-arm64\.zip\.part[0-9]+$/.test(asset.name)))) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            // Only the rolling tag moves. Immutable version tags are never rewritten.
            if (tag === 'latest') {
              await github.rest.git.updateRef({ owner, repo, ref: 'tags/latest', sha: context.sha, force: true });
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'tags/latest' });
              if (ref.object.type !== 'commit' || ref.object.sha !== context.sha) {
                throw new Error('The rolling release tag does not point to the packaged commit.');
              }
              core.notice(`Verified rolling release at ${context.sha}.`);
            }
