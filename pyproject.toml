[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ai-studio"
version = "2.0.0"
description = "Autonomous 1.58-Bit Local AI Desktop Studio with Real-Time Streaming, ChatGPT-Style Canvas, RLVR Sandbox, and EWC Sleep Consolidation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Commercial Source-Available License (v1.0)" }
authors = [
    { name = "Smart AI Studio Contributors" }
]
keywords = [
    "ai",
    "llm",
    "local-ai",
    "mlx",
    "apple-silicon",
    "1-58bit",
    "bitlinear",
    "bitnet",
    "ternary-bonsai",
    "qwen",
    "dolphin-vision",
    "reasoning-model",
    "rlvr",
    "reinforcement-learning",
    "sleep-consolidation",
    "ewc",
    "code-generation",
    "ai-canvas",
    "desktop-app",
    "tkinter",
    "model-context-protocol",
    "mcp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "sympy>=1.12",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "huggingface_hub>=0.20.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
mlx = [
    "mlx>=0.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
gguf = [
    "llama-cpp-python>=0.2.70",
]

[project.urls]
Homepage = "https://github.com/Eabusham2/smart-ai-studio"
Documentation = "https://github.com/Eabusham2/smart-ai-studio#readme"
Repository = "https://github.com/Eabusham2/smart-ai-studio.git"
Issues = "https://github.com/Eabusham2/smart-ai-studio/issues"
Changelog = "https://github.com/Eabusham2/smart-ai-studio/releases"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/live"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
