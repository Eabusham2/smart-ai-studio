[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-reasoning-engine"
version = "0.1.0"
description = "Local 1.58-Bit 27B Autonomous Reasoning System with Pro Search, RLVR Sandbox Verification, and EWC Sleep Consolidation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "sympy>=1.12",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
mlx = [
    "mlx>=0.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
